<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="key" gradientUnits="userSpaceOnUse" cx="260" cy="-120" r="1100">
      <stop offset="0" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".085"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".11"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#0a0a0c"/>
  <rect width="1440" height="900" fill="url(#key)"/>
  <!-- three overlapping lens discs: crisp edges out in the open, soft glows through the glass -->
  <circle cx="1130" cy="30" r="440" fill="url(#a)"/>
  <circle cx="1490" cy="650" r="340" fill="url(#b)"/>
  <circle cx="120" cy="960" r="430" fill="url(#c)"/>
  <circle cx="1130" cy="30" r="580" fill="none" stroke="#fff" stroke-opacity=".055"/>
  <circle cx="120" cy="960" r="570" fill="none" stroke="#fff" stroke-opacity=".045"/>
</svg>
